services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cm-platform-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "#Pop,6300"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: cm-platform-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: cm_platform
      RABBITMQ_DEFAULT_PASS: cm_platform_dev
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  email-dispatcher:
    build:
      context: ..
      dockerfile: docker/Dockerfile.background
    image: cm-platform/background:dev
    container_name: cm-platform-email-dispatcher
    command: ["npm", "--workspace", "services/email-dispatcher", "run", "start"]
    depends_on:
      - rabbitmq
    environment:
      LOG_LEVEL: info
      NODE_ENV: development
      RABBITMQ_URL: amqp://cm_platform:cm_platform_dev@rabbitmq:5672
      EMAIL_DISPATCHER_PREFETCH: "5"
    volumes:
      - ../packages/secrets/cm-platform.env:/app/packages/secrets/cm-platform.env:ro
    restart: unless-stopped

  widget-consumer-fast:
    image: cm-platform/background:dev
    container_name: cm-platform-widget-consumer-fast
    command: ["npm", "--workspace", "services/widget-consumer", "run", "start"]
    depends_on:
      - db
      - rabbitmq
    environment:
      DB_SERVER: db
      DB_PORT: "1433"
      DB_USER: sa
      DB_PASSWORD: "#Pop,6300"
      DB_DATABASE: CMPlatform
      LOG_LEVEL: info
      NODE_ENV: development
      RABBITMQ_URL: amqp://cm_platform:cm_platform_dev@rabbitmq:5672
      WIDGET_CONSUMER_NAME: fast-consumer
      WIDGET_CONSUMER_PROCESSING_SECONDS: "1"
    restart: unless-stopped

  widget-consumer-slow:
    image: cm-platform/background:dev
    container_name: cm-platform-widget-consumer-slow
    command: ["npm", "--workspace", "services/widget-consumer", "run", "start"]
    depends_on:
      - db
      - rabbitmq
    environment:
      DB_SERVER: db
      DB_PORT: "1433"
      DB_USER: sa
      DB_PASSWORD: "#Pop,6300"
      DB_DATABASE: CMPlatform
      LOG_LEVEL: info
      NODE_ENV: development
      RABBITMQ_URL: amqp://cm_platform:cm_platform_dev@rabbitmq:5672
      WIDGET_CONSUMER_NAME: slow-consumer
      WIDGET_CONSUMER_PROCESSING_SECONDS: "5"
    restart: unless-stopped

volumes:
  mssql_data:
    external: true
    name: docker_mssql_data
  rabbitmq_data:
    name: cm_platform_rabbitmq_data
