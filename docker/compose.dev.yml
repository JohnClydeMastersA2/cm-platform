services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cm-platform-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "#Pop,6300"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  mssql_data:
    external: true
    name: docker_mssql_data
