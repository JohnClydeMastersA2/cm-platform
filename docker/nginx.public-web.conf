server {
    listen 8080;
    server_name _;

    if ($host !~ ^(cmplatform\.dev|localhost|127\.0\.0\.1)$) {
        return 444;
    }

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
    }

    location = /ready {
        proxy_pass http://127.0.0.1:3000/ready;
    }

    location /auth/ {
        proxy_pass http://127.0.0.1:3000;
    }

    location /internal/ {
        proxy_pass http://127.0.0.1:3000;
    }

    location /widgets {
        proxy_pass http://127.0.0.1:3000;
    }

    location /consumer-widgets {
        proxy_pass http://127.0.0.1:3000;
    }

    location /topic-routing {
        proxy_pass http://127.0.0.1:3000;
    }

    location /priority-queue {
        proxy_pass http://127.0.0.1:3000;
    }

    location /platform/status {
        proxy_pass http://127.0.0.1:3000;
    }

    location /email-webhook-events {
        proxy_pass http://127.0.0.1:3000;
    }

    location /webhooks/ {
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
