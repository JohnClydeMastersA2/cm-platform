<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">CM Platform CI/CD architecture</title>
  <desc id="desc">Diagram showing developer workstation, GitHub, GitHub Actions, GHCR, Azure Container Apps, and managed production services.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#495057"/>
    </marker>
    <style>
      .title { fill: #212529; font: 700 28px Arial, sans-serif; }
      .subtitle { fill: #6c757d; font: 16px Arial, sans-serif; }
      .label { fill: #212529; font: 700 15px Arial, sans-serif; }
      .small { fill: #495057; font: 13px Arial, sans-serif; }
      .lane { fill: #f8f9fa; stroke: #dee2e6; stroke-width: 1; }
      .source { fill: #e7f1ff; stroke: #0d6efd; stroke-width: 2; }
      .build { fill: #fff3cd; stroke: #ffc107; stroke-width: 2; }
      .runtime { fill: #d1e7dd; stroke: #198754; stroke-width: 2; }
      .managed { fill: #f8d7da; stroke: #dc3545; stroke-width: 2; }
      .line { fill: none; stroke: #495057; stroke-width: 2.5; marker-end: url(#arrow); }
      .soft-line { fill: none; stroke: #6c757d; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#ffffff"/>
  <text x="40" y="48" class="title">CM Platform CI/CD Architecture</text>
  <text x="40" y="76" class="subtitle">Source control, image publishing, protected Azure deployment, and managed production dependencies</text>

  <rect x="40" y="110" width="1120" height="150" rx="18" class="lane"/>
  <text x="62" y="140" class="label">Source and CI/CD</text>

  <rect x="70" y="165" width="150" height="62" rx="10" class="source"/>
  <text x="145" y="190" text-anchor="middle" class="label">Developer</text>
  <text x="145" y="210" text-anchor="middle" class="small">workstation</text>

  <rect x="270" y="165" width="150" height="62" rx="10" class="source"/>
  <text x="345" y="190" text-anchor="middle" class="label">GitHub</text>
  <text x="345" y="210" text-anchor="middle" class="small">repository</text>

  <rect x="470" y="165" width="170" height="62" rx="10" class="build"/>
  <text x="555" y="190" text-anchor="middle" class="label">GitHub Actions</text>
  <text x="555" y="210" text-anchor="middle" class="small">build and CodeQL</text>

  <rect x="700" y="165" width="160" height="62" rx="10" class="build"/>
  <text x="780" y="190" text-anchor="middle" class="label">GHCR</text>
  <text x="780" y="210" text-anchor="middle" class="small">SHA-tagged images</text>

  <rect x="920" y="165" width="190" height="62" rx="10" class="build"/>
  <text x="1015" y="190" text-anchor="middle" class="label">Protected deploy</text>
  <text x="1015" y="210" text-anchor="middle" class="small">approval, OIDC, Bicep</text>

  <path class="line" d="M220 196 H270"/>
  <path class="line" d="M420 196 H470"/>
  <path class="line" d="M640 196 H700"/>
  <path class="line" d="M860 196 H920"/>

  <rect x="40" y="300" width="1120" height="260" rx="18" class="lane"/>
  <text x="62" y="330" class="label">Azure Container Apps production runtime</text>

  <rect x="470" y="350" width="260" height="72" rx="12" class="runtime"/>
  <text x="600" y="378" text-anchor="middle" class="label">Container Apps Environment</text>
  <text x="600" y="400" text-anchor="middle" class="small">consumption hosting for app and workers</text>

  <rect x="90" y="465" width="180" height="62" rx="10" class="runtime"/>
  <text x="180" y="490" text-anchor="middle" class="label">Public web</text>
  <text x="180" y="510" text-anchor="middle" class="small">Nginx + API sidecar</text>

  <rect x="310" y="465" width="170" height="62" rx="10" class="runtime"/>
  <text x="395" y="490" text-anchor="middle" class="label">Email dispatcher</text>
  <text x="395" y="510" text-anchor="middle" class="small">background worker</text>

  <rect x="520" y="465" width="170" height="62" rx="10" class="runtime"/>
  <text x="605" y="490" text-anchor="middle" class="label">Widget consumers</text>
  <text x="605" y="510" text-anchor="middle" class="small">fast and slow workers</text>

  <rect x="730" y="465" width="190" height="62" rx="10" class="runtime"/>
  <text x="825" y="490" text-anchor="middle" class="label">Demo maintenance</text>
  <text x="825" y="510" text-anchor="middle" class="small">scheduled cleanup job</text>

  <rect x="960" y="465" width="150" height="62" rx="10" class="runtime"/>
  <text x="1035" y="490" text-anchor="middle" class="label">Log Analytics</text>
  <text x="1035" y="510" text-anchor="middle" class="small">runtime logs</text>

  <path class="line" d="M1015 227 C1015 280 600 285 600 350"/>
  <path class="line" d="M560 422 C520 445 260 440 180 465"/>
  <path class="line" d="M585 422 C545 445 450 442 395 465"/>
  <path class="line" d="M610 422 C610 440 606 448 605 465"/>
  <path class="line" d="M635 422 C675 445 760 442 825 465"/>
  <path class="line" d="M660 422 C725 445 930 440 1035 465"/>

  <rect x="40" y="600" width="1120" height="120" rx="18" class="lane"/>
  <text x="62" y="630" class="label">Managed production dependencies</text>

  <rect x="85" y="655" width="150" height="44" rx="9" class="managed"/>
  <text x="160" y="682" text-anchor="middle" class="label">Cloudflare</text>

  <rect x="280" y="655" width="150" height="44" rx="9" class="managed"/>
  <text x="355" y="682" text-anchor="middle" class="label">Azure SQL</text>

  <rect x="475" y="655" width="150" height="44" rx="9" class="managed"/>
  <text x="550" y="682" text-anchor="middle" class="label">MongoDB Atlas</text>

  <rect x="670" y="655" width="150" height="44" rx="9" class="managed"/>
  <text x="745" y="682" text-anchor="middle" class="label">CloudAMQP</text>

  <rect x="865" y="655" width="150" height="44" rx="9" class="managed"/>
  <text x="940" y="682" text-anchor="middle" class="label">Resend</text>

  <path class="soft-line" d="M180 527 C180 585 160 600 160 655"/>
  <path class="soft-line" d="M245 527 C275 585 335 600 355 655"/>
  <path class="soft-line" d="M305 527 C365 585 520 600 550 655"/>
  <path class="soft-line" d="M605 527 C625 585 720 600 745 655"/>
  <path class="soft-line" d="M395 527 C500 585 875 600 940 655"/>
</svg>
