name: MongoDB Atlas Check

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type CHECK MONGODB to verify the production Atlas connection
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-mongodb-check
  cancel-in-progress: false

jobs:
  check-mongodb-atlas:
    name: Check MongoDB Atlas
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Require explicit MongoDB confirmation
        env:
          MONGODB_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "${MONGODB_CONFIRMATION}" != "CHECK MONGODB" ]]; then
            echo "MongoDB confirmation must be exactly CHECK MONGODB."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify MongoDB Atlas connection
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: CMPlatformDocuments
          MONGODB_REQUIRE_READ_WRITE: "true"
          MONGODB_DENIED_DATABASE: healthcare_transform
        run: npm run mongodb:check

      - name: Verify healthcare-transform MongoDB Atlas connection
        env:
          MONGODB_URI: ${{ secrets.HEALTHCARE_TRANSFORM_MONGODB_URI }}
          MONGODB_DATABASE: healthcare_transform
          MONGODB_REQUIRE_READ_WRITE: "true"
          MONGODB_DENIED_DATABASE: CMPlatformDocuments
        run: npm run mongodb:check

      - name: Record MongoDB summary
        if: success()
        run: |
          {
            echo "## MongoDB Atlas Check"
            echo ""
            echo "- Connected with the GitHub production MONGODB_URI secret"
            echo "- Ran a MongoDB ping command against CMPlatformDocuments"
            echo "- Verified read/write access to CMPlatformDocuments and denial from healthcare_transform"
            echo "- Connected with the dedicated GitHub production HEALTHCARE_TRANSFORM_MONGODB_URI secret"
            echo "- Ran a MongoDB ping command against healthcare_transform"
            echo "- Verified read/write access to healthcare_transform and denial from CMPlatformDocuments"
            echo "- Printed no connection string or password"
            echo "- Deployed no Azure resources"
          } >> "${GITHUB_STEP_SUMMARY}"
