name: SQL Migration Identity

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type CREATE MIGRATOR to prepare the dedicated Azure SQL migration identity
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-sql-maintenance
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: rg-cm-platform-prod
  SQL_SERVER_NAME: sql-cmplatform-prod-cus-qw3ws5xs6wfom
  SQL_SERVER_FQDN: sql-cmplatform-prod-cus-qw3ws5xs6wfom.database.windows.net
  SQL_DATABASE_NAME: CMPlatform
  SQL_MIGRATION_USER: cmplatform_migrator
  FIREWALL_RULE_PREFIX: github-migrator-

jobs:
  prepare-migration-identity:
    name: Prepare Migration Identity
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Require explicit identity confirmation
        env:
          IDENTITY_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "${IDENTITY_CONFIRMATION}" != "CREATE MIGRATOR" ]]; then
            echo "Identity confirmation must be exactly CREATE MIGRATOR."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Remove stale temporary runner rules
        run: |
          mapfile -t stale_rules < <(
            az sql server firewall-rule list \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --server "${SQL_SERVER_NAME}" \
              --query "[?starts_with(name, 'github-')].name" \
              --output tsv
          )

          for rule in "${stale_rules[@]}"; do
            [[ -z "${rule}" ]] && continue
            az sql server firewall-rule delete \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --server "${SQL_SERVER_NAME}" \
              --name "${rule}"
          done

      - name: Discover runner public IPv4 address
        id: runner
        run: |
          runner_ip=$(curl --fail --silent --show-error https://api.ipify.org)

          if [[ ! "${runner_ip}" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "Runner public address is not a valid IPv4 address."
            exit 1
          fi

          IFS='.' read -r octet1 octet2 octet3 octet4 <<< "${runner_ip}"
          for octet in "${octet1}" "${octet2}" "${octet3}" "${octet4}"; do
            if (( 10#${octet} > 255 )); then
              echo "Runner public address contains an invalid IPv4 octet."
              exit 1
            fi
          done

          rule_name="${FIREWALL_RULE_PREFIX}${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "ip=${runner_ip}"
            echo "rule_name=${rule_name}"
          } >> "${GITHUB_OUTPUT}"

      - name: Open temporary runner firewall rule
        env:
          RUNNER_IP: ${{ steps.runner.outputs.ip }}
          FIREWALL_RULE_NAME: ${{ steps.runner.outputs.rule_name }}
        run: |
          az sql server firewall-rule create \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --server "${SQL_SERVER_NAME}" \
            --name "${FIREWALL_RULE_NAME}" \
            --start-ip-address "${RUNNER_IP}" \
            --end-ip-address "${RUNNER_IP}" \
            --output none

      - name: Prepare contained migration identity
        env:
          DB_SERVER: ${{ env.SQL_SERVER_FQDN }}
          DB_PORT: "1433"
          DB_USER: cmplatformddl
          DB_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          DB_MIGRATION_USER: ${{ env.SQL_MIGRATION_USER }}
          DB_MIGRATION_PASSWORD: ${{ secrets.SQL_MIGRATION_PASSWORD }}
          DB_DATABASE: ${{ env.SQL_DATABASE_NAME }}
          DB_ENCRYPT: "true"
          DB_TRUST_SERVER_CERTIFICATE: "false"
        run: |
          for attempt in {1..20}; do
            if npm run db:bootstrap:migration-identity; then
              exit 0
            fi

            echo "Bootstrap connection not ready (${attempt}/20); waiting..."
            sleep 15
          done

          echo "Migration identity bootstrap did not succeed before timeout."
          exit 1

      - name: Verify migration identity connection and permissions
        env:
          DB_SERVER: ${{ env.SQL_SERVER_FQDN }}
          DB_PORT: "1433"
          DB_USER: placeholder
          DB_PASSWORD: placeholder
          DB_MIGRATION_USER: ${{ env.SQL_MIGRATION_USER }}
          DB_MIGRATION_PASSWORD: ${{ secrets.SQL_MIGRATION_PASSWORD }}
          DB_DATABASE: ${{ env.SQL_DATABASE_NAME }}
          DB_ENCRYPT: "true"
          DB_TRUST_SERVER_CERTIFICATE: "false"
        run: |
          npm run db:check
          npm run db:check:migration-permissions

      - name: Close temporary runner firewall rule
        if: always() && steps.runner.outputs.rule_name != ''
        env:
          FIREWALL_RULE_NAME: ${{ steps.runner.outputs.rule_name }}
        run: |
          if az sql server firewall-rule show \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --server "${SQL_SERVER_NAME}" \
            --name "${FIREWALL_RULE_NAME}" \
            --output none 2>/dev/null; then
            az sql server firewall-rule delete \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --server "${SQL_SERVER_NAME}" \
              --name "${FIREWALL_RULE_NAME}"
          fi

          if az sql server firewall-rule show \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --server "${SQL_SERVER_NAME}" \
            --name "${FIREWALL_RULE_NAME}" \
            --output none 2>/dev/null; then
            echo "Temporary firewall rule still exists after cleanup."
            exit 1
          fi

      - name: Record identity summary
        if: success()
        run: |
          {
            echo "## Azure SQL Migration Identity"
            echo ""
            echo "- Created or rotated contained user: ${SQL_MIGRATION_USER}"
            echo "- Granted CREATE TABLE on CMPlatform"
            echo "- Granted ALTER, SELECT, INSERT, UPDATE, and DELETE on schema dbo"
            echo "- Verified encrypted login and permissions as the migration identity"
            echo "- Confirmed the database contained zero user tables before bootstrap"
            echo "- Applied no schema migrations"
            echo "- Removed the temporary firewall rule"
          } >> "${GITHUB_STEP_SUMMARY}"
