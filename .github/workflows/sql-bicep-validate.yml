name: SQL Bicep Validate

on:
  pull_request:
    branches:
      - main
    paths:
      - infra/bicep/modules/sql.bicep
      - infra/bicep/sql-plan.bicep
      - infra/bicep/parameters/sql-production.bicepparam
      - .github/workflows/sql-bicep-validate.yml
  push:
    branches:
      - main
    paths:
      - infra/bicep/modules/sql.bicep
      - infra/bicep/sql-plan.bicep
      - infra/bicep/parameters/sql-production.bicepparam
      - .github/workflows/sql-bicep-validate.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  AZURE_RESOURCE_GROUP: rg-cm-platform-prod
  SQL_BICEP_TEMPLATE: infra/bicep/sql-plan.bicep
  SQL_BICEP_PARAMETERS: infra/bicep/parameters/sql-production.bicepparam

jobs:
  sql-bicep-build:
    name: SQL Bicep Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bicep
        run: az bicep install

      - name: Build SQL Bicep template
        run: az bicep build --file "${SQL_BICEP_TEMPLATE}"

  azure-sql-validate:
    name: Azure SQL Validate
    runs-on: ubuntu-latest
    needs: sql-bicep-build
    if: github.event_name == 'workflow_dispatch'
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep
        run: az bicep install

      - name: Validate Azure SQL deployment
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
        run: |
          az deployment group validate \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --template-file "${SQL_BICEP_TEMPLATE}" \
            --parameters "${SQL_BICEP_PARAMETERS}" \
            --parameters sqlAdministratorLoginPassword="${SQL_ADMIN_PASSWORD}"

      - name: What-if Azure SQL deployment
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
        run: |
          az deployment group what-if \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --template-file "${SQL_BICEP_TEMPLATE}" \
            --parameters "${SQL_BICEP_PARAMETERS}" \
            --parameters sqlAdministratorLoginPassword="${SQL_ADMIN_PASSWORD}"

      - name: Record SQL validation summary
        run: |
          {
            echo "## Azure SQL Bicep Validation"
            echo ""
            echo "- Validated the SQL logical server and CMPlatform database"
            echo "- Requested the Azure SQL free monthly allowance"
            echo "- Configured AutoPause when the free allowance is exhausted"
            echo "- No Azure SQL resources were deployed"
          } >> "${GITHUB_STEP_SUMMARY}"
