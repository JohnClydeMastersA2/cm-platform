name: SQL Bicep Deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY to create or update the Azure SQL resources
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-sql-deployment
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: rg-cm-platform-prod
  SQL_BICEP_PARAMETERS: infra/bicep/parameters/sql-production.bicepparam

jobs:
  deploy-sql:
    name: Deploy Azure SQL
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Require explicit deployment confirmation
        env:
          DEPLOYMENT_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "${DEPLOYMENT_CONFIRMATION}" != "DEPLOY" ]]; then
            echo "Deployment confirmation must be exactly DEPLOY."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep
        run: az bicep install

      - name: Validate Azure SQL deployment
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
        run: |
          az deployment group validate \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --parameters "${SQL_BICEP_PARAMETERS}" \
            --output none

      - name: Preview Azure SQL deployment
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
        run: |
          az deployment group what-if \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --parameters "${SQL_BICEP_PARAMETERS}" \
            --result-format ResourceIdOnly

      - name: Deploy Azure SQL resources
        id: deploy
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
        run: |
          deployment_name="cm-platform-sql-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          az deployment group create \
            --name "${deployment_name}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --parameters "${SQL_BICEP_PARAMETERS}" \
            --output none

          server_name=$(az deployment group show \
            --name "${deployment_name}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query properties.outputs.sqlServerName.value \
            --output tsv)
          database_name=$(az deployment group show \
            --name "${deployment_name}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query properties.outputs.sqlDatabaseName.value \
            --output tsv)
          database_id=$(az deployment group show \
            --name "${deployment_name}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query properties.outputs.sqlDatabaseId.value \
            --output tsv)

          {
            echo "deployment_name=${deployment_name}"
            echo "server_name=${server_name}"
            echo "database_name=${database_name}"
            echo "database_id=${database_id}"
          } >> "${GITHUB_OUTPUT}"

      - name: Verify SQL cost-control settings
        env:
          SERVER_NAME: ${{ steps.deploy.outputs.server_name }}
          DATABASE_NAME: ${{ steps.deploy.outputs.database_name }}
          DATABASE_ID: ${{ steps.deploy.outputs.database_id }}
        run: |
          database_sku=$(az sql db show \
            --name "${DATABASE_NAME}" \
            --server "${SERVER_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query sku.name \
            --output tsv)
          minimum_tls=$(az sql server show \
            --name "${SERVER_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query minimalTlsVersion \
            --output tsv)
          database_status=$(az sql db show \
            --name "${DATABASE_NAME}" \
            --server "${SERVER_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query status \
            --output tsv)

          if [[ "${database_sku}" != "Basic" ]]; then
            echo "Azure SQL cost-control verification failed: sku=${database_sku}"
            exit 1
          fi

          if [[ "${minimum_tls}" != "1.2" ]]; then
            echo "Azure SQL transport verification failed: minimalTlsVersion=${minimum_tls}"
            exit 1
          fi

          {
            echo "## Azure SQL Deployment"
            echo ""
            echo "- Deployment: ${{ steps.deploy.outputs.deployment_name }}"
            echo "- Server: ${SERVER_NAME}"
            echo "- Database: ${DATABASE_NAME}"
            echo "- Database status: ${database_status}"
            echo "- SQL SKU: ${database_sku}"
            echo "- Minimum TLS: ${minimum_tls}"
            echo "- Firewall rules and schema migrations: not included"
          } >> "${GITHUB_STEP_SUMMARY}"
