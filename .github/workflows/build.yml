name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Build source
        run: npm run build

      - name: Test healthcare transform service
        working-directory: services/healthcare-transform
        run: bash ./mvnw test

  container-build:
    name: Container Build
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t cm-platform/svc-core:${{ github.sha }} .

      - name: Build public web image
        run: docker build -f docker/Dockerfile.public-web -t cm-platform/public-web:${{ github.sha }} .

      - name: Build email dispatcher image
        run: docker build -f docker/Dockerfile.email-dispatcher -t cm-platform/email-dispatcher:${{ github.sha }} .

      - name: Build widget consumer image
        run: docker build -f docker/Dockerfile.widget-consumer -t cm-platform/widget-consumer:${{ github.sha }} .

      - name: Build demo maintenance image
        run: docker build -f docker/Dockerfile.demo-maintenance -t cm-platform/demo-maintenance:${{ github.sha }} .

      - name: Build healthcare transform image
        run: docker build -f docker/Dockerfile.healthcare-transform -t cm-platform/healthcare-transform:${{ github.sha }} .

  publish-images:
    name: Publish Images
    runs-on: ubuntu-latest
    needs:
      - build
      - container-build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare image names
        shell: bash
        run: |
          owner_lower="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image_prefix="ghcr.io/${owner_lower}/cm-platform"
          echo "IMAGE_PREFIX=${image_prefix}" >> "${GITHUB_ENV}"
          echo "Publishing images under ${image_prefix}"

      - name: Log in to GHCR
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push API image
        shell: bash
        run: |
          image="${IMAGE_PREFIX}/svc-core:${GITHUB_SHA}"
          docker build -f docker/Dockerfile.api -t "${image}" .
          docker push "${image}"

      - name: Build and push public web image
        shell: bash
        run: |
          image="${IMAGE_PREFIX}/public-web:${GITHUB_SHA}"
          docker build -f docker/Dockerfile.public-web -t "${image}" .
          docker push "${image}"

      - name: Build and push email dispatcher image
        shell: bash
        run: |
          image="${IMAGE_PREFIX}/email-dispatcher:${GITHUB_SHA}"
          docker build -f docker/Dockerfile.email-dispatcher -t "${image}" .
          docker push "${image}"

      - name: Build and push widget consumer image
        shell: bash
        run: |
          image="${IMAGE_PREFIX}/widget-consumer:${GITHUB_SHA}"
          docker build -f docker/Dockerfile.widget-consumer -t "${image}" .
          docker push "${image}"

      - name: Build and push demo maintenance image
        shell: bash
        run: |
          image="${IMAGE_PREFIX}/demo-maintenance:${GITHUB_SHA}"
          docker build -f docker/Dockerfile.demo-maintenance -t "${image}" .
          docker push "${image}"

      - name: Build and push healthcare transform image
        shell: bash
        run: |
          image="${IMAGE_PREFIX}/healthcare-transform:${GITHUB_SHA}"
          docker build -f docker/Dockerfile.healthcare-transform -t "${image}" .
          docker push "${image}"

      - name: Record published images
        shell: bash
        run: |
          {
            echo "## Published Images"
            echo ""
            echo "- ${IMAGE_PREFIX}/svc-core:${GITHUB_SHA}"
            echo "- ${IMAGE_PREFIX}/public-web:${GITHUB_SHA}"
            echo "- ${IMAGE_PREFIX}/email-dispatcher:${GITHUB_SHA}"
            echo "- ${IMAGE_PREFIX}/widget-consumer:${GITHUB_SHA}"
            echo "- ${IMAGE_PREFIX}/demo-maintenance:${GITHUB_SHA}"
            echo "- ${IMAGE_PREFIX}/healthcare-transform:${GITHUB_SHA}"
          } >> "${GITHUB_STEP_SUMMARY}"
